<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join RedDrop - Register as Voluntary Donor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind-config.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">

  <!-- Top Simple Nav -->
  <header class="auth-header">
    <div class="auth-nav">
      <a href="index.html" class="auth-brand">
        <div class="auth-logo">
          <i data-lucide="droplet"></i>
        </div>
        <span class="auth-brand-name">Red<span>Drop</span></span>
      </a>
      <div class="auth-actions">
        <a href="login.html" class="btn-auth-login">
          <i data-lucide="log-in"></i> Dedicated Login &rarr;
        </a>
        <a href="index.html" class="btn-auth-back">
          &larr; Back to Home
        </a>
      </div>
    </div>
  </header>

  <!-- Auth Main Container -->
  <main class="auth-main">
    <div class="auth-card">
      
      <!-- Registration Header -->
      <div class="auth-card-header">
        <div>
          <h2 class="auth-title">Register as a Lifesaver</h2>
          <p class="auth-subtitle">Join over 2,450+ verified voluntary blood donors across Bangladesh.</p>
        </div>
        <a href="login.html" class="btn-switch-login">
          <i data-lucide="log-in"></i> Already Registered? Log in &rarr;
        </a>
      </div>

      <!-- Registration Form View -->
      <div id="view-register">
        <form onsubmit="handleRegistration(event)" class="auth-form">
          <!-- Step 1: Personal Info -->
          <div class="form-group">
            <label class="form-label">Full Name *</label>
            <input type="text" id="reg-name" required placeholder="e.g. Mahim Bin Tariq" class="form-input">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Blood Group *</label>
              <select id="reg-blood" required class="form-select blood-select">
                <option value="A+">A+ (A Positive)</option>
                <option value="A-">A- (A Negative)</option>
                <option value="B+">B+ (B Positive)</option>
                <option value="B-">B- (B Negative)</option>
                <option value="O+">O+ (O Positive)</option>
                <option value="O-">O- (O Negative)</option>
                <option value="AB+">AB+ (AB Positive)</option>
                <option value="AB-">AB- (AB Negative)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Gender *</label>
              <select id="reg-gender" class="form-select">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Age (Years) *</label>
              <input type="number" id="reg-age" min="18" max="65" value="22" required class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">Body Weight (kg) *</label>
              <input type="number" id="reg-weight" min="48" max="150" value="65" required class="form-input">
            </div>
          </div>

          <!-- Step 2: Location -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">District *</label>
              <select id="reg-district" required class="form-select">
                <option value="Dhaka">Dhaka</option>
                <option value="Chattogram">Chattogram</option>
                <option value="Sylhet">Sylhet</option>
                <option value="Rajshahi">Rajshahi</option>
                <option value="Khulna">Khulna</option>
                <option value="Barishal">Barishal</option>
                <option value="Rangpur">Rangpur</option>
                <option value="Mymensingh">Mymensingh</option>
                <option value="Cumilla">Cumilla</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Area / Thana *</label>
              <input type="text" id="reg-area" required placeholder="e.g. Dhanmondi 32" class="form-input">
            </div>
          </div>

          <!-- Step 3: Contact Details -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Phone (01XXXXXXXXX) *</label>
              <input type="tel" id="reg-phone" required placeholder="01711223344" pattern="01[3-9][0-9]{8}" class="form-input" style="font-weight: 700;">
            </div>
            <div class="form-group">
              <label class="form-label">Email (Optional)</label>
              <input type="email" id="reg-email" placeholder="mahim@gmail.com" class="form-input">
            </div>
          </div>

          <!-- Compliance checkbox -->
          <div class="compliance-box">
            <input type="checkbox" id="reg-agree" required class="compliance-checkbox">
            <label for="reg-agree" class="compliance-label">
              I certify that I am at least 18 years old, weigh 48kg+, and am willing to voluntarily donate blood to save lives.
            </label>
          </div>

          <button type="submit" class="btn-submit">
            Complete Registration & Get Donor ID &rarr;
          </button>
        </form>
      </div>

    </div>
  </main>

  <footer class="auth-footer">
    &copy; 2026 RedDrop Blood Donation Network Bangladesh
  </footer>

  <script src="data.js"></script>
  <script src="nav-footer.js"></script>
  <script>
    function handleRegistration(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const bloodGroup = document.getElementById('reg-blood').value;
      const gender = document.getElementById('reg-gender').value;
      const age = document.getElementById('reg-age').value;
      const weight = document.getElementById('reg-weight').value;
      const district = document.getElementById('reg-district').value;
      const area = document.getElementById('reg-area').value;
      const phone = document.getElementById('reg-phone').value;
      const email = document.getElementById('reg-email').value || `${name.toLowerCase().replace(/\s+/g, '')}@gmail.com`;

      const newDonor = {
        name,
        bloodGroup,
        gender,
        age: parseInt(age),
        weight: parseInt(weight),
        district,
        area: `${area}, ${district}`,
        division: district === 'Chattogram' ? 'Chattogram' : district === 'Sylhet' ? 'Sylhet' : 'Dhaka',
        phone,
        email,
        totalDonations: 0,
        lastDonatedDate: null,
        status: "AVAILABLE",
        donorId: `RD-BD-2026-${Math.floor(1000 + Math.random() * 9000)}`
      };

      RedDropStore.addDonor(newDonor);
      RedDropAuth.login(newDonor, 'donor');

      showToast(`Welcome ${name}! Your donor profile is created.`, 'success');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 700);
    }
  </script>
</body>
</html>
